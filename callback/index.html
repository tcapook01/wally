<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Wally · conexión bancaria</title>
<style>
  :root { --bg:#f4f1ea; --ink:#2b2a27; --soft:#77736a; --acc:#e0a526; --ok:#3f8f5a; --err:#c2453b; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
         color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { width:min(520px, 92vw); background:#fff; border-radius:20px; padding:32px;
          box-shadow:0 1px 0 rgba(0,0,0,.04), 0 12px 32px rgba(60,50,20,.08); text-align:center; }
  .bot { width:84px; height:84px; margin:0 auto 12px; }
  h1 { font-size:22px; margin:4px 0 6px; }
  p { color:var(--soft); margin:0 0 18px; }
  .url { width:100%; font:13px ui-monospace, monospace; padding:12px; border:1px solid #e4dfd3;
         border-radius:12px; background:#faf8f3; color:var(--ink); resize:none; }
  button { margin-top:14px; border:0; border-radius:999px; padding:12px 22px; font-weight:600;
           font-size:15px; background:var(--ink); color:#fff; cursor:pointer; }
  .status { margin-top:12px; font-size:14px; min-height:20px; }
  .ok { color:var(--ok); } .err { color:var(--err); }
</style>
</head>
<body>
<main class="card">
  <svg class="bot" viewBox="0 0 84 84" aria-hidden="true">
    <rect x="18" y="26" width="48" height="36" rx="12" fill="#e0a526"/>
    <rect x="26" y="34" width="32" height="18" rx="9" fill="#2b2a27"/>
    <circle cx="35" cy="43" r="4" fill="#fff"/><circle cx="49" cy="43" r="4" fill="#fff"/>
    <rect x="40" y="14" width="4" height="12" rx="2" fill="#2b2a27"/>
    <circle cx="42" cy="12" r="4" fill="#e0a526"/>
    <rect x="24" y="64" width="12" height="8" rx="3" fill="#2b2a27"/>
    <rect x="48" y="64" width="12" height="8" rx="3" fill="#2b2a27"/>
  </svg>
  <h1 id="title">¡Listo! Ya casi está</h1>
  <p id="msg">Copia esta dirección y pégala en la terminal donde está Wally.</p>
  <textarea id="url" class="url" rows="4" readonly></textarea>
  <button id="copy" type="button">Copiar dirección</button>
  <div id="status" class="status"></div>
</main>
<script>
  // Esta página no envía nada a ningún sitio: solo muestra la dirección para copiarla.
  const params = new URLSearchParams(location.search);
  const box = document.getElementById("url");
  box.value = location.href;
  if (params.get("error")) {
    document.getElementById("title").textContent = "El banco no ha completado la conexión";
    document.getElementById("msg").textContent =
      (params.get("error_description") || params.get("error")) + ". Puedes volver a intentarlo desde Wally.";
    document.getElementById("title").className = "err";
  } else if (!params.get("code")) {
    document.getElementById("title").textContent = "Aquí no hay ningún código";
    document.getElementById("msg").textContent = "Abre esta página desde el enlace que te da Wally al conectar un banco.";
  }
  document.getElementById("copy").addEventListener("click", async () => {
    const s = document.getElementById("status");
    try { await navigator.clipboard.writeText(box.value); s.textContent = "Copiada ✓"; s.className = "status ok"; }
    catch { box.select(); s.textContent = "Selecciónala y cópiala con Ctrl/Cmd + C"; s.className = "status"; }
  });
</script>
</body>
</html>
